<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#efe6d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Plan treningowy na 28 tygodni">
<title>Plan 28</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="app-version" content="2026-11-10.6-audyt">
<script>
try{const t=localStorage.getItem('plan28-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
:root{
  color-scheme:light dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-caption:12px;--fs-footnote:13px;--fs-sub:15px;--fs-body:17px;--fs-title3:20px;--fs-title2:22px;--fs-title1:28px;--fs-large:34px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s12:48px;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;
  --tap:44px;
  --ease:cubic-bezier(.2,.8,.2,1);--t-fast:120ms;--t-med:220ms;--t-slow:360ms;
  --z-sticky:10;--z-overlay:100;--z-toast:1000;
  --blur:saturate(180%) blur(20px);
}
:root,:root[data-theme="light"]{
  --bg:#efe6d6;--bg-elev:#fffaf2;
  --surface:rgba(255,250,242,.78);--surface-solid:#fffaf2;
  --bar:rgba(239,230,214,.82);--bar-solid:#efe6d6;
  --field:rgba(92,68,32,.10);--sep:rgba(70,52,28,.18);
  --text:#1c1812;--text-2:#6b5c48;
  --accent:#8a6420;--accent-text:#6b4c14;--accent-fill:#5c4010;--on-accent:#fff8eb;
  --ok:#2f7d3a;--ok-text:#1d5a26;--warn:#c46a00;--warn-text:#8a4a00;--bad:#c4251c;--bad-text:#9e1f17;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 12px 28px rgba(60,40,10,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0b09;--bg-elev:#1a1714;--surface:rgba(26,23,20,.76);--surface-solid:#1a1714;
    --bar:rgba(12,11,9,.78);--bar-solid:#0c0b09;--field:rgba(212,179,106,.14);--sep:rgba(212,179,106,.22);
    --text:#f6f0e6;--text-2:#b6aa96;--accent:#d4b36a;--accent-text:#e0c48a;--accent-fill:#8a6420;--on-accent:#fff8eb;
    --ok:#30d158;--ok-text:#30d158;--warn:#ff9f0a;--warn-text:#ffb340;--bad:#ff453a;--bad-text:#ff6961;
    --shadow:0 10px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0b09;--bg-elev:#1a1714;--surface:rgba(26,23,20,.76);--surface-solid:#1a1714;
  --bar:rgba(12,11,9,.78);--bar-solid:#0c0b09;--field:rgba(212,179,106,.14);--sep:rgba(212,179,106,.22);
  --text:#f6f0e6;--text-2:#b6aa96;--accent:#d4b36a;--accent-text:#e0c48a;--accent-fill:#8a6420;--on-accent:#fff8eb;
  --ok:#30d158;--ok-text:#30d158;--warn:#ff9f0a;--warn-text:#ffb340;--bad:#ff453a;--bad-text:#ff6961;
  --shadow:0 10px 32px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100% }
body{margin:0;min-height:100vh;min-height:100dvh;font:400 var(--fs-body)/1.47 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:clip;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em);background:var(--field);border:1px solid var(--sep);border-radius:var(--r-md);padding:12px 14px;width:100% }
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--surface-solid);border:1px solid var(--sep);box-shadow:var(--shadow)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--surface-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background:
  radial-gradient(1100px 460px at 8% -12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 58%),
  radial-gradient(800px 380px at 110% 8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 52%),
  var(--bg);
}
#lock{position:fixed;inset:0;z-index:var(--z-overlay);display:grid;place-items:end center;padding:24px 24px calc(28px + env(safe-area-inset-bottom));background:#0c0b09 url("img/hero.jpg") center/cover no-repeat}
#lock::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,9,.25) 0%,rgba(12,11,9,.72) 55%,rgba(12,11,9,.88) 100%)}
#lock.hidden{display:none}
.lock-card{position:relative;z-index:1;width:min(400px,100%);padding:28px 24px;border-radius:var(--r-xl);background:rgba(22,18,14,.78);color:#f6f0e6;border:1px solid rgba(212,179,106,.35)}
.lock-card h1{margin:0 0 8px;font-size:var(--fs-title1);letter-spacing:-.02em;text-wrap:balance;font-weight:700}
.lock-card p{margin:0 0 20px;color:#c9bda8;font-size:var(--fs-sub)}
.lock-card .field span{color:#c9bda8}
.lock-card input{background:rgba(255,248,235,.1);border-color:rgba(212,179,106,.35);color:#f6f0e6}
.lock-kicker{display:block;margin:0 0 8px;font-size:var(--fs-caption);letter-spacing:.14em;text-transform:uppercase;color:#d4b36a;font-weight:600}
.btn{min-height:var(--tap);padding:12px 18px;border-radius:var(--r-md);font-weight:600}
.btn:active{transform:scale(.97);transition:transform var(--t-fast) var(--ease)}
.btn-primary{background:var(--accent-fill);color:var(--on-accent);width:100% }
.btn-ghost{background:var(--field);color:var(--text)}
.app{display:none;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app.on{display:block}
.top{position:sticky;top:0;z-index:var(--z-sticky);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid transparent}
.top.stuck{border-bottom-color:var(--sep)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:var(--fs-title2);font-weight:700;letter-spacing:-.02em}
.sub{color:var(--text-2);font-size:var(--fs-footnote)}
.icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:var(--r-sm);background:var(--field)}
main{width:min(920px,100%);margin:0 auto;padding:16px 16px 32px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.track button{min-height:56px;padding:8px;border-radius:var(--r-md);background:var(--bg-elev);border:1px solid var(--sep);text-align:left}
.track button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.track b{display:block;font-size:var(--fs-footnote)}
.track span{display:block;color:var(--text-2);font-size:var(--fs-caption)}
.weekbar{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scroll-padding-inline:16px}
.weekbar button{flex:0 0 auto;min-width:44px;min-height:44px;border-radius:var(--r-pill);background:var(--field);font-variant-numeric:tabular-nums}
.weekbar button[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
.card{background:var(--bg-elev);border:1px solid var(--sep);border-radius:var(--r-lg);padding:16px;margin:0 0 12px}
.card h2,.card h3{margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
.card h2{font-size:var(--fs-title3)}
.card h3{font-size:var(--fs-body)}
.muted{color:var(--text-2)}
.ex{padding:12px 0;border-top:1px solid var(--sep)}
.ex:first-of-type{border-top:0;padding-top:0}
.ex-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ex-name{font-weight:600}
.ex-load{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:var(--fs-caption);color:var(--text-2);background:var(--field);border-radius:var(--r-pill);padding:4px 8px}
.alt{margin-top:6px;font-size:var(--fs-footnote);color:var(--text-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.track{grid-template-columns:1fr 1fr}}
label.field{display:block;margin:0 0 12px}
label.field span{display:block;margin:0 0 6px;font-size:var(--fs-footnote);color:var(--text-2)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-footnote);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sep);vertical-align:top}
th{color:var(--text-2);font-weight:500}
.table-wrap{overflow:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sticky);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--sep)}
.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2);font-size:11px;border-radius:var(--r-sm)}
.tabs button[aria-current="page"]{color:var(--accent-text)}
.tabs svg{width:22px;height:22px}
.panel{display:none}
.panel.on{display:block}
.meal{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--sep)}
.meal:first-of-type{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--field);border-radius:var(--r-md);padding:12px}
.kpi b{display:block;font-size:var(--fs-title3);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{color:var(--text-2);font-size:var(--fs-caption)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--sep);border-radius:var(--r-pill);padding:10px 16px;z-index:var(--z-toast);display:none}
#toast.on{display:block}
.err{color:var(--bad-text);font-size:var(--fs-footnote);min-height:1.2em;margin:8px 0 0}

.ex{display:flex;gap:12px;align-items:flex-start}
.ex-media{width:76px;height:76px;border-radius:var(--r-md);object-fit:cover;flex:0 0 76px;background:var(--field)}
.ex-body{min-width:0;flex:1}
.week-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;margin:0 0 12px;min-height:168px;background:#1a1714}
.week-hero img{display:block;width:100%;height:168px;object-fit:cover}
.week-hero-cap{position:absolute;inset:auto 0 0 0;padding:28px 16px 16px;background:linear-gradient(180deg,transparent,rgba(12,11,9,.82));color:#f6f0e6}
.week-hero-cap h2{margin:0 0 4px;color:#f6f0e6;font-size:var(--fs-title2)}
.week-hero-cap p{margin:0;color:#d2c6b0}
.card{box-shadow:var(--shadow)}
.tabs button{font-size:12px}

/* --- widoki, okna, kopia zapasowa --- */
.view{position:fixed;inset:0;z-index:120;background:var(--bg);overflow:auto;display:none;overscroll-behavior:contain;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view.on{display:block}
.view-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bar-solid);border-bottom:1px solid var(--sep)}
.view-bar h2{margin:0;font-size:var(--fs-title3);letter-spacing:-.02em}
.view-body{width:min(920px,100%);margin:0 auto;padding:16px 16px 48px}
.btn-inline{width:auto}
.btn-row{display:grid;gap:8px;margin:12px 0 0}
@media (min-width:560px){.btn-row{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.btn-danger{background:var(--field);color:var(--bad-text);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.head-actions{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative}
.badge-dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--bar-solid)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r-lg);padding:14px 16px;margin:0 0 12px;background:var(--bg-elev);border:1px solid var(--warn);color:var(--text)}
.banner p{margin:0;flex:1 1 200px}
.banner .btn{width:auto}
.modal{position:fixed;inset:0;z-index:1100;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.55)}
.modal.on{display:grid}
.modal-card{width:min(420px,100%);background:var(--bg-elev);border:1px solid var(--sep);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.modal-card h3{margin:0 0 8px;font-size:var(--fs-title3)}
.modal-card p{margin:0 0 16px;color:var(--text-2)}
.modal-actions{display:grid;gap:8px}
.kv{width:100%;border-collapse:collapse}
.kv th,.kv td{padding:8px 6px}
.kv td.num,.kv th.num{text-align:right}
.steps{padding-left:22px;margin:8px 0}
.steps li{margin:6px 0}
.status-ok{color:var(--ok-text)}
.status-warn{color:var(--warn-text)}
.callout{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0;color:var(--text-2)}
body.noscroll{overflow:hidden}

/* --- baza ćwiczeń --- */
#v-excard{z-index:140}
.ex-search{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:3;background:var(--bg);padding:8px 0 4px;margin:0 0 8px}
.ex-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ex-filters select{padding:10px 12px;min-height:44px}
.ex-chk{display:flex;align-items:center;gap:12px;min-height:44px}
.ex-chk input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--accent-fill)}
.exrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:var(--r-md);background:var(--bg-elev);border:1px solid var(--sep);min-height:76px;margin:0 0 8px;content-visibility:auto;contain-intrinsic-size:auto 76px}
.exrow img{width:64px;height:64px;object-fit:cover;border-radius:var(--r-sm);background:var(--field)}
.exrow strong{display:block;font-size:var(--fs-sub);line-height:1.3}
.exrow .muted{display:block;font-size:var(--fs-footnote)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:var(--r-pill);padding:2px 8px;margin:0 4px 0 0;background:var(--field);color:var(--text)}
.badge.plan{background:var(--accent-fill);color:var(--on-accent)}
.ex-imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.ex-imgs img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r-md);background:var(--field)}
.ex-links{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.ex-links .btn{min-height:44px;padding:8px 14px;font-size:var(--fs-sub);width:auto}
.ses-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ses-head .btn{min-height:44px;padding:6px 12px;font-size:var(--fs-footnote);width:auto;flex:0 0 auto}
.steps li{line-height:1.45}
.src-note{font-size:var(--fs-footnote);color:var(--text-2);margin:16px 0 0}
.src-note a{color:var(--accent-text)}

/* --- sesja treningowa --- */
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 8px}
.card-head h3{margin:0}
.card-head .btn{flex:0 0 auto}
.today{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.today h2{margin:0 0 4px}
.today p{margin:0}
.today .btn{width:auto}
.ses-body{padding:12px 10px calc(180px + env(safe-area-inset-bottom))}
.ses-ex{background:var(--bg-elev);border:1px solid var(--sep);border-radius:var(--r-lg);padding:12px 10px;margin:0 0 12px;box-shadow:var(--shadow)}
.ses-ex h3{margin:0;font-size:var(--fs-body);letter-spacing:-.01em;text-wrap:balance}
.ses-meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.ses-last{font-size:var(--fs-footnote);color:var(--text-2);margin:0 0 8px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 62px 54px 46px 44px;gap:6px;align-items:center;margin:0 0 6px}
.srow.head{font-size:12px;color:var(--text-2);text-align:center;margin:0 0 2px}
.srow input{text-align:center;padding:0 2px;height:44px;border-radius:var(--r-sm);min-width:0}
.srow input::placeholder{color:var(--text-2);opacity:1}
.s-btn{min-height:44px;min-width:44px;border-radius:var(--r-sm);background:var(--field);font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.s-btn:active{transform:scale(.96);transition:transform var(--t-fast) var(--ease)}
.s-prev{font-size:13px;font-weight:500;color:var(--accent-text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.s-prev[disabled]{color:var(--text-2);cursor:default}
.s-type.w{color:var(--warn-text)}
.s-type.f{color:var(--bad-text)}
.s-type.d{color:var(--accent-text)}
.s-ok svg{width:24px;height:24px}
.srow.done .s-ok{background:var(--accent-fill);color:var(--on-accent)}
.srow.done input{border-color:var(--accent)}
.s-legend{font-size:12px;color:var(--text-2);margin:8px 0 0}
.ses-actions{display:flex;gap:8px;margin:8px 0 0}
.ses-actions .btn{flex:1;min-height:44px;padding:8px 10px}
.ses-foot{display:grid;gap:8px;margin:16px 0}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:130;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bar-solid);border-top:1px solid var(--accent);box-shadow:0 -8px 24px rgba(0,0,0,.25);display:none}
.rest.on{display:block}
.rest-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}
.rest-label{font-size:var(--fs-footnote);color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest-time{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.rest.over .rest-time{color:var(--ok-text)}
.rest-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rest-btns .btn{min-height:44px;padding:8px}
.rest-bar{height:4px;background:var(--field);border-radius:2px;overflow:hidden;margin:0 0 10px}
.rest-bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--sep)}
.sum-row:first-child{border-top:0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 0;border-top:1px solid var(--sep)}
.sw:first-of-type{border-top:0}
.sw input[type=checkbox]{width:24px;height:24px;flex:0 0 auto;accent-color:var(--accent-fill)}
.sw select{width:auto;min-width:110px;padding:10px 12px}
.hist details{border-top:1px solid var(--sep)}
.hist summary{min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:6px 0;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist .h-ex{padding:6px 0;font-size:var(--fs-footnote)}
.hist .h-ex b{display:block;font-size:var(--fs-sub)}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function imgFor(name){
  const n = String(name).toLowerCase();

  if(/mobiliz|zakończ/.test(n)) return "stretch.jpg";
  if(/serie wejściowe|trening właściwy/.test(n)) return "plates.jpg";
  if(/przysiad/.test(n)) return "rack.jpg";
  if(/skos|rozpiętk|wyciskanie sztangi leż|maszynie poziomej/.test(n)) return "db-press.jpg";

  if(/hip thrust|rdl|prostowanie tułowia/.test(n)) return "hiphinge.jpg";
  if(/leg press|uginanie ud|wspięc|wypad|prostowanie nóg|odwodzenie/.test(n)) return "legs.jpg";
  if(/dead bug|deska|brzuch i postawa/.test(n)) return "plank.jpg";
  if(/wznosy y/.test(n)) return "stretch.jpg";
  if(/spacer farmerski/.test(n)) return "plates.jpg";
  if(/wiosł|wyciąg|face pull|pallof|prostowanie na wyciągu/.test(n)) return "cable.jpg";
  if(/wznosy|uginanie|wyciskanie hantli siedz/.test(n)) return "dumbbells.jpg";
  return "club.jpg";
}

const DELOADS = [12,18,24,28];
function blockOf(w){return BLOCKS.find(b=>w>=b.weeks[0]&&w<=b.weeks[1])}
function phaseOf(w){return PHASES.find(p=>w>=p.weeks[0]&&w<=p.weeks[1])}
function isDeload(w){return DELOADS.includes(w)}
function isControl(w){return w===6}
function levelOf(w){return w<=2?0:w<=4?1:w<=8?2:w<=14?3:w<=21?4:5}
function prevLoadWeek(w){let p=w-1; while(p>1&&isDeload(p)) p--; return Math.max(1,p)}
function rirOf(w){
  if(isDeload(w)) return w===28 ? "RIR 4 · tydzień lżejszy i pomiary" : "RIR 4 · tydzień lżejszy (deload): mniej serii, ciężar −10%";
  if(w<=2) return "RIR 4";
  if(w<=4) return "RIR 3";
  if(w===5) return "RIR 2–3";
  if(w===6) return "RIR 3 · tydzień kontrolny: bez dokładania ciężaru";
  if(w<=21) return "RIR 2–3";
  return "RIR 2";
}
function roundTo(v, step){
  if(!step) return 0;
  return Math.round(v/step)*step;
}
/* orientacyjny udział drogi od ciężaru startowego do celu (nie jest obowiązkiem: ciężar rośnie po powtórzeniach i RIR) */
function loadPct(week){
  const w = isDeload(week) ? prevLoadWeek(week) : week;
  if(w<=2) return 0;
  if(w<=4) return 0.10;
  if(w<=6) return 0.20;
  if(w<=8) return 0.28;
  if(w<=14) return 0.40 + (w-9)*0.02;
  if(w<=21) return 0.55 + (w-15)*0.03;
  return 0.80 + (w-22)*0.03;
}
function capFor(ex, week){
  if(ex.capTo21 && week<=21) return ex.capTo21;
  return ex.cap;
}
function rawLoad(ex, week){
  const cap = capFor(ex, week);
  const span = (ex.cap??ex.w) - ex.w;
  const raw = ex.w + span * loadPct(week);
  return Math.min(cap??raw, roundTo(raw, ex.step));
}
function loadFor(ex, week){
  if(ex.bw) return "bw";
  if(ex.w==null) return null;
  if(!ex.step) return ex.w||null;
  const v = rawLoad(ex, week);
  if(isDeload(week)) return Math.max(ex.step, roundTo(v*0.9, ex.step));
  return v;
}
function fmtKg(v){
  if(v==="bw") return "ciężar ciała";
  if(v==null) return "dobór wg RIR";
  return (Number.isInteger(v)?v:v.toFixed(2).replace(/0$/,"").replace(".",","))+" kg";
}
function isLowerDay(dayId){return dayId==="LA"||dayId==="LB"}
function repsFor(ex, week, dayId){
  if(ex.r) return ex.r;
  const b = blockOf(week).id;
  if(ex.kind==="iso") return {A:"12–15",B:"10–15",C:"10–15",D:"12–15"}[b];
  if(isLowerDay(dayId)) return b==="A" ? "8–10" : "8–12";
  return {A:"8–10",B:"6–10",C:"6–10",D:"8–10"}[b];
}
function repsHi(txt){const m=/(\d+)\D+(\d+)/.exec(String(txt)); return m?+m[2]:null}
function repsLoNum(txt){const m=/(\d+)/.exec(String(txt)); return m?+m[1]:null}
function setsFor(ex, week){
  if(isDeload(week)){
    const prev = ex.s[levelOf(prevLoadWeek(week))];
    return prev<=0 ? 0 : Math.max(2, Math.round(prev*0.6));
  }
  return ex.s[levelOf(week)];
}
function setsForCore(week, ex){
  return (ex&&ex.s)||2;
}
/* serie na partię w danym tygodniu (bezpośrednie 1, pośrednie 0,5) */
function weekVolume(week){
  const v={};
  Object.keys(EX).forEach(d=>{
    EX[d].forEach(ex=>{const s=setsFor(ex,week); Object.entries(ex.m).forEach(([g,x])=>{v[g]=(v[g]||0)+s*x})});
    CORE[d].forEach(ex=>{const s=setsForCore(week,ex); Object.entries(ex.m).forEach(([g,x])=>{v[g]=(v[g]||0)+s*x})});
  });
  return v;
}
function daySets(dayId, week){
  return {lifts:EX[dayId].reduce((s,ex)=>s+setsFor(ex,week),0), core:CORE[dayId].reduce((s,ex)=>s+setsForCore(week,ex),0)};
}
/* orientacyjny czas sesji w minutach (model: wejście ≈12, serie w superserii ≈2,2, proste główne ≈3, proste izolacje ≈2,3, brzuch ≈1,5, zakończenie ≈4) */
function dayMinutes(dayId, week){
  let m=12+4;
  EX[dayId].forEach(ex=>{const s=setsFor(ex,week); m+=s*(ex.ss?2.2:(ex.kind==="main"?3:2.3))});
  CORE[dayId].forEach(ex=>{m+=setsForCore(week,ex)*1.5});
  return Math.round(m/5)*5;
}

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

      if(!sets) return "";
      const kg = loadFor(ex, week);
      const partner = ex.ss ? EX[day.id].find(x=>x.ss===ex.ss[0]+(ex.ss[1]==="1"?"2":"1")&&setsFor(x,week)>0) : null;
      const ssChip = partner ? `<span class="chip">superseria ${esc(ex.ss)}</span>` : "";
      const tempo = ex.kind==="main" ? `<span class="chip">opuszczanie 2–3 s</span>` : "";
      return `${exHead(ex.n, esc(fmtKg(kg)))}
        <div class="chips"><span class="chip">${sets} × ${esc(repsFor(ex, week, day.id))}</span><span class="chip">${esc(rirOf(week).split("·")[0].trim())}</span>${tempo}${ssChip}</div>
        ${partner?`<div class="alt">Na zmianę z: ${esc(partner.n.replace(/\s*\(.*$/,""))}. Przerwa dopiero po obu ćwiczeniach.</div>`:""}

        ${exLinks(ex.n)}
      </div></div>`;
    }).join("");
    const core = CORE[day.id].map(ex=>{
      const kg = loadFor(ex, week);
      const sets = setsForCore(week, ex);
      return `${exHead(ex.n, esc(fmtKg(kg)))}
        <div class="chips"><span class="chip">${sets} × ${esc(ex.r)}</span><span class="chip">brzuch i postawa</span></div>
        <div class="alt">Zamiennik: ${esc(ex.alt)}</div>
        ${exLinks(ex.n)}
      </div></div>`;

    const list = sessionOpen(day.id)
      + `${exHead("4. Trening właściwy", `${ds.lifts} serii`)}${dl?`<div class="alt">Tydzień lżejszy: mniej serii, ciężar ok. −10%, RIR 4.</div>`:""}</div></div>` + lifts

  }).join("");
}

function trendCard(rows){
  const day=86400000, now=Date.now();
  const dated=rows.map(r=>({r,t:new Date(String(r.date)+"T12:00:00").getTime()})).filter(x=>Number.isFinite(x.t));
  const cur=dated.filter(x=>now-x.t<=7*day).map(x=>x.r), prev=dated.filter(x=>now-x.t>7*day&&now-x.t<=14*day).map(x=>x.r);
  const a=avgOf(cur,"kg"), b=avgOf(prev,"kg");
  let line="Za mało wpisów masy z ostatnich 14 dni, żeby policzyć trend. Wpisuj wagę codziennie rano.";
  if(a!==null&&b!==null){
    const pct=(a-b)/b*100; const f=x=>(x>0?"+":x<0?"−":"")+Math.abs(x).toFixed(2).replace(".",",");
    line=`Średnia z ostatnich 7 dni: ${a.toFixed(1).replace(".",",")} kg. Zmiana względem poprzednich 7 dni: ${f(a-b)} kg (${f(pct)}% tygodniowo). W redukcji celem jest −0,25 do −0,5% na tydzień.`;
  }
  const last=rows.length?rows[0]:null; const sh=last?num(last.barki):null, wa=last?num(last.talia):null;
  const ratio = (sh!==null&&wa!==null&&wa>0) ? `<p>Barki / talia w ostatnim wpisie: <strong>${(sh/wa).toFixed(2).replace(".",",")}</strong>. Śledź kierunek zmiany, nie wartość docelową.</p>` : "";
  return `<div class="card"><h2>Trend</h2><p>${esc(line)}</p>${ratio}</div>`;
}

    const prev=document.activeElement;

    const onKey=e=>{if(e.key==="Escape") done(false)};

}

let _aliasIdx=null, _aliasUserSig="", _aliasBases=[];
function aliasIndex(){
  const user=loadJSON(LS.aliases,{}); const sig=JSON.stringify(user);
  if(_aliasIdx&&sig===_aliasUserSig) return _aliasIdx;
  const idx={}, base={};
  const names=planExNames();
  // nazwy planu z tą samą bazą (przed nawiasem) tworzą jedną grupę, np. kilka wariantów „Dead bug”
  names.forEach(n=>{const b=normKey(n.split(" (")[0]); if(!base[b]) base[b]=n; idx[normKey(n)]=base[b]});
  Object.entries(ALIASES).forEach(([plan,list])=>{const c=idx[normKey(plan)]||plan; idx[normKey(plan)]=c; list.forEach(a=>{idx[normKey(a)]=c})});
  Object.entries(user).forEach(([k,plan])=>{ if(plan) idx[k]=idx[normKey(plan)]||plan });
  _aliasBases=names.map(n=>[normKey(n.split(" (")[0]),idx[normKey(n)]||n]).filter(x=>x[0].length>=8);
  _aliasIdx=idx; _aliasUserSig=sig; return idx;
}

function canonEx(name){const i=aliasIndex(); const k=normKey(name); if(i[k]) return i[k]; for(const [b,c] of _aliasBases){ if(k.startsWith(b)) return c } return String(name||"")}
function isPlanEx(name){return !!aliasIndex()[normKey(name)]}

/* --- parser CSV (czysty JS) --- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const nl=text.indexOf("\n"); const first=text.slice(0,nl>-1?nl:text.length);
  const delim=(first.split(";").length>first.split(",").length)?";":",";
  const rows=[]; let row=[], f="", q=false, i=0; const n=text.length;
  while(i<n){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){f+='"'; i+=2; continue} q=false; i++; continue }
      f+=ch; i++; continue;
    }
    if(ch==='"'){q=true; i++; continue}
    if(ch===delim){row.push(f); f=""; i++; continue}
    if(ch==="\r"){i++; continue}
    if(ch==="\n"){row.push(f); rows.push(row); row=[]; f=""; i++; continue}
    f+=ch; i++;
  }
  if(f!==""||row.length){row.push(f); rows.push(row)}
  return rows.filter(r=>!(r.length===1&&r[0]===""));
}

function parseHevyDate(str){

  if((m=/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})/.exec(str))){y=+m[1];mo=+m[2];d=+m[3];h=+m[4];mi=+m[5]}
  else if((m=/^(\d{1,2})\s+([^\s,\d]+?)\.?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i.exec(str))){
    d=+m[1]; mo=monthNo(m[2]); y=+m[3]; h=+m[4]; mi=+m[5]; if(m[6]) h=(h%12)+(/pm/i.test(m[6])?12:0);
  }
  else if((m=/^([^\s,\d]+?)\.?\s+(\d{1,2}),?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i.exec(str))){
    mo=monthNo(m[1]); d=+m[2]; y=+m[3]; h=+m[4]; mi=+m[5]; if(m[6]) h=(h%12)+(/pm/i.test(m[6])?12:0);
  }
  else if((m=/^(\d{1,2})\.(\d{2})\.(\d{4}),?\s+(\d{1,2}):(\d{2})/.exec(str))){d=+m[1];mo=+m[2];y=+m[3];h=+m[4];mi=+m[5]}
  else return null;
  if(!mo||mo>12||d<1||d>31||h>23||mi>59) return null;
  const date=`${y}-${pad2(mo)}-${pad2(d)}`;
  return {date, iso:`${date}T${pad2(h)}:${pad2(mi)}`, ts:new Date(y,mo-1,d,h,mi).getTime()};
}
const SET_TYPES={normal:"normal",warmup:"warmup",failure:"failure",dropset:"dropset",drop:"dropset",working:"normal",straight:"normal",fail:"failure"};
function num(v){
  if(v===undefined||v===null) return null;
  const t=String(v).trim().replace(",","."); if(t==="") return null;
  const x=parseFloat(t); return Number.isFinite(x)?x:null;
}
function parseHevyCsv(text){
  const rows=parseCSV(String(text||""));
  if(rows.length<2) return {error:"Plik jest pusty albo ma tylko nagłówek."};
  const hdr=rows[0].map(h=>h.trim().toLowerCase());
  const col=n=>hdr.indexOf(n);
  const iEx=col("exercise_title"), iStart=col("start_time");
  if(iEx<0||iStart<0) return {error:"To nie wygląda na eksport treningów z Hevy: brakuje kolumn exercise_title i start_time."};
  const iKg=hdr.findIndex(h=>/^weight[_ (]*kg/.test(h));
  const iLb=hdr.findIndex(h=>/^weight[_ (]*(lb|lbs|pound)/.test(h));
  if(iKg<0&&iLb<0) return {error:"Brak kolumny weight_kg ani weight_lbs."};
  const lbs=iKg<0, iW=lbs?iLb:iKg;
  const iTitle=col("title"), iEnd=col("end_time"), iIdx=col("set_index"), iType=col("set_type"), iReps=col("reps"), iDur=col("duration_seconds"), iRpe=col("rpe");
  const iDist=hdr.findIndex(h=>/^distance_(km|miles?)$/.test(h));
  const cell=(r,i)=>i>=0&&i<r.length?r[i]:"";
  const sess=new Map(); const st={rows:rows.length-1, skipped:0, badDate:0, unknownTypes:0, unit:lbs?"lbs":"kg", empty:0};
  const counters=new Map();
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const ex=cell(row,iEx).trim();
    const t0=parseHevyDate(cell(row,iStart));
    if(!ex){st.skipped++; continue}
    if(!t0){st.badDate++; st.skipped++; continue}
    const title=(cell(row,iTitle)||"Trening").trim()||"Trening";
    const key=title+"|"+t0.iso;
    let S=sess.get(key);
    if(!S){const t1=parseHevyDate(cell(row,iEnd)); S={key,title,start:t0.iso,end:t1?t1.iso:null,ts:t0.ts,endTs:t1?t1.ts:null,date:t0.date,sets:[]}; sess.set(key,S)}
    let w=num(cell(row,iW)); if(w!==null&&lbs) w=Math.round(w*0.45359237*100)/100;
    const reps=num(cell(row,iReps)), dur=num(cell(row,iDur)), dist=num(cell(row,iDist));
    if(w===null&&reps===null&&dur===null&&dist===null){st.empty++; st.skipped++; continue}
    const rawT=String(cell(row,iType)||"normal").toLowerCase().replace(/[^a-z]/g,"");
    let type=SET_TYPES[rawT]; if(!type){type="normal"; st.unknownTypes++}
    const ck=key+"|"+ex; const c=counters.get(ck)||0; counters.set(ck,c+1);
    const set={ex, i:c, type, kg:w, reps};
    const rpe=num(cell(row,iRpe)); if(rpe!==null) set.rpe=rpe;
    if(dur!==null) set.dur=dur; if(dist!==null) set.dist=dist;
    S.sets.push(set);
  }
  const sessions=[...sess.values()].filter(x=>x.sets.length).sort((a,b)=>a.ts-b.ts);
  return {sessions, stats:st, headers:hdr};
}
function isWorkType(t){return t!=="warmup"}

function fmtNum(v){return v===null||v===undefined||v===""?"":String(v).replace(".",",")}
function mmss(sec){sec=Math.max(0,Math.round(sec));return `${Math.floor(sec/60)}:${pad2(sec%60)}`}
function hhmm(ts){const d=new Date(ts);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`}

function rirNumFor(week){
  const m=/RIR\s*(\d)(?:\s*[–-]\s*(\d))?/.exec(rirOf(week)); if(!m) return "";
  return String(m[2]?Math.max(+m[1],+m[2]):+m[1]);
}
function repsLow(txt){const m=/(\d+)/.exec(String(txt)); return m?m[1]:""}
function lastAppSession(canon){
  const now=Date.now(), by=new Map();
  for(const t of loadJSON(LS.sets,[])){
    if(t.src!=="app"||t.type==="warmup"||t.kg==null||t.reps==null) continue;
    if(isDeload(t.week)||now-(t.ts||0)>28*86400000) continue;
    if(canonEx(t.ex)!==canon) continue;
    let g=by.get(t.sid); if(!g){g={ts:t.ts||0,sets:[]}; by.set(t.sid,g)} g.sets.push(t);
  }
  return [...by.values()].sort((a,b)=>b.ts-a.ts)[0]||null;

/* podwójna progresja: ciężar z ostatniej sesji w aplikacji, +krok gdy wszystkie serie były na górze zakresu przy RIR nie niższym niż w planie */
function suggestKg(it, week){
  const ex=it.ex, base=loadFor(ex,week);
  if(ex.bw) return {kg:base, note:""};
  const last=lastAppSession(canonEx(it.n));
  if(!last||!last.sets.length) return {kg:base, note:""};
  const hi=repsHi(it.repsTxt), lo=repsLoNum(it.repsTxt), step=ex.step||2.5;
  const rm=/(\d)/.exec(rirOf(week)); const rirMin=rm?+rm[1]:0;
  const lastKg=Math.max(...last.sets.map(t=>t.kg));
  const top=last.sets.filter(t=>t.kg===lastKg);
  let next=lastKg, why=`ostatnio ${fmtNum(lastKg)} kg, bez zmiany`;
  if(top.some(t=>lo!==null&&t.reps<lo)){ next=Math.max(step,lastKg-step); why=`ostatnio ${fmtNum(lastKg)} kg, mniej niż dolna granica: krok w dół`; }
  else if(hi!==null&&top.length>=2&&top.every(t=>t.reps>=hi&&(t.rir==null||t.rir>=rirMin))){ next=lastKg+step; why=`ostatnio ${fmtNum(lastKg)} kg, wszystkie serie na górze zakresu: krok w górę`; }
  if(isDeload(week)){ next=Math.max(step,roundTo(lastKg*0.9,step)); why=`tydzień lżejszy: ok. −10% z ${fmtNum(lastKg)} kg`; }
  if(ex.hard){ const cap=capFor(ex,week); if(cap!=null&&next>cap){ next=cap; why+=`; limit orientacyjny ${fmtNum(cap)} kg w tym bloku`; } }
  return {kg:next, note:why};
}
function buildActive(dayId){
  const week=currentWeekSel(); const rirT=rirNumFor(week);
  const items=[];
  EX[dayId].forEach(ex=>{
    const sets=setsFor(ex,week); if(!sets) return;
    const partner=ex.ss?EX[dayId].find(x=>x.ss===ex.ss[0]+(ex.ss[1]==="1"?"2":"1")&&setsFor(x,week)>0):null;
    items.push({n:ex.n, kind:ex.kind||"iso", core:false, unit:"", ex, sets, repsTxt:repsFor(ex,week,dayId), ss:partner?ex.ss:"", ssWith:partner?partner.n:""});
  });
  CORE[dayId].forEach(ex=>items.push({n:ex.n, kind:"iso", core:true, unit:/\bs\b/.test(ex.r||"")?"s":"", ex, sets:setsForCore(week,ex), repsTxt:ex.r}));
  items.forEach((it,xi)=>{
    const sg=it.core?{kg:loadFor(it.ex,week),note:""}:suggestKg(it,week);
    const kg=sg.kg; it.bw=kg==="bw"; it.planKg=(kg==="bw"||kg==null)?null:kg; it.sugNote=sg.note||"";
    it.rirTxt=it.core?"":rirT; it.rows=[];
    const step=it.ex.step||2.5;
    if(xi===0&&it.planKg!=null){
      [0.5,0.7].forEach(f=>it.rows.push({t:"w",kg:"",reps:"",rir:"",done:false,sid:null,ph:{kg:fmtNum(Math.max(step,roundTo(it.planKg*f,step))),reps:repsLow(it.repsTxt),rir:""}}));
    }
    for(let j=0;j<it.sets;j++) it.rows.push({t:"n",kg:"",reps:"",rir:"",done:false,sid:null,ph:{kg:it.planKg!=null?fmtNum(it.planKg):"",reps:repsLow(it.repsTxt),rir:it.rirTxt}});
  });
  return {id:newId("a"), dayId, week, date:todayStr(), startTs:Date.now(), items};
}

function buildPrev(excludeSid){

/* ===== timer przerwy (od Date.now(), nie od licznika) ===== */
let rest=null, restTimer=null, actx=null, wake=null;
function restFor(it,kind){

function startRest(it,kind){

  if(kind!=="w"&&it.ss&&/1$/.test(it.ss)&&it.ssWith){ sec=15; trans=true; label=`Superseria · teraz: ${String(it.ssWith).replace(/\s*\(.*$/,"")}`; }
  rest={endTs:Date.now()+sec*1000, total:sec, label, ex:canonEx(it.n), fired:false, kind, trans};
  localStorage.setItem(LS.rest,JSON.stringify(rest)); showRest();
}
function resumeRest(){
  const r=safeParse(localStorage.getItem(LS.rest),null);

}
function stopRest(){rest=null; localStorage.removeItem(LS.rest); hideRest()}
function showRest(){

  if(!restTimer) restTimer=setInterval(tickRest,250); tickRest();
}
function hideRest(){$("rest").classList.remove("on","over"); if(restTimer){clearInterval(restTimer); restTimer=null}}
function tickRest(){
  if(!rest){hideRest(); return}
  const left=Math.ceil((rest.endTs-Date.now())/1000);
  const box=$("rest");
  if(left<=0){
    $("rest-time").textContent="0:00"; box.classList.add("over"); $("rest-label").textContent="Koniec przerwy. Następna seria.";
    $("rest-fill").style.transform="scaleX(0)";
    if(!rest.fired){
      rest.fired=true; localStorage.setItem(LS.rest,JSON.stringify(rest));
      if(document.visibilityState==="visible"){ beep(); const s=getSettings(); if(s.vibrate&&navigator.vibrate) navigator.vibrate([200,100,200]); }
      $("rest-live").textContent="Koniec przerwy"; setTimeout(()=>{$("rest-live").textContent=""},1500);
    }
    return;
  }
  box.classList.remove("over"); $("rest-label").textContent=rest.label;
  $("rest-time").textContent=mmss(left);
  $("rest-fill").style.transform=`scaleX(${Math.max(0,Math.min(1,(rest.endTs-Date.now())/(rest.total*1000)))})`;
}
function adjustRest(delta){
  if(!rest) return;
  const now=Date.now();
  if(rest.endTs<=now){ if(delta<0) return; rest.endTs=now+delta*1000; rest.total=delta; }
  else { rest.endTs+=delta*1000; rest.total=Math.max(15,rest.total+delta); if(rest.endTs<=now) rest.endTs=now; }
  rest.fired=false;
  if(rest.kind!=="w"&&!rest.trans){ const m=Object.assign({},getSettings().restEx); m[rest.ex]=Math.max(15,Math.round(rest.total)); saveSettings({restEx:m}); }
  localStorage.setItem(LS.rest,JSON.stringify(rest)); showRest(); tickRest();
}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume()}catch(e){}}
function beep(){
  if(!getSettings().sound||!actx) return;
  try{ const t=actx.currentTime;
    [0,.25,.5].forEach((d,i)=>{const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=i===2?1046:880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(.25,t+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d+.18); o.start(t+d); o.stop(t+d+.2)});
  }catch(e){}
}

  old.slice().reverse().forEach((r,ri)=>{
    const date=String(r.date||todayStr()).slice(0,10); const sid="legacy-"+date;
    const ts=new Date(date+"T12:00:00").getTime()||Date.now();
    if(!have.has(sid)){sessions.push({id:sid,title:"Wpis ręczny",start:date+"T12:00",ts,date,src:"legacy"}); have.add(sid)}
    const cnt=Math.min(20,Math.max(1,parseInt(r.sets,10)||1));
    for(let k=0;k<cnt;k++){
      const t={id:`L${ri}-${k}`,sid,ts,date,ex:String(r.ex||""),i:k,type:"normal",kg:num(r.kg),reps:num(r.reps),src:"legacy"};
      const rir=num(r.rir); if(rir!==null) t.rir=rir; sets.push(t); n++;
    }
  });
  try{
    localStorage.setItem(LS.sets,JSON.stringify(sets)); localStorage.setItem(LS.sessions,JSON.stringify(sessions)); localStorage.setItem(LS.legacyDone,"1");
  }catch(e){ toast("Brak miejsca na przeniesienie starych wyników. Zrób kopię."); }
}

/* ===== Wyniki: historia sesji ===== */
let histShown=20;
function sessionAgg(){
  const sess=loadJSON(LS.sessions,[]); const sets=loadJSON(LS.sets,[]);
  const agg=new Map();
  sets.forEach(t=>{const k=t.sid||("d-"+t.date); let a=agg.get(k); if(!a){a={work:0,warm:0,vol:0}; agg.set(k,a)} if(t.type==="warmup")a.warm++; else {a.work++; a.vol+=(t.kg||0)*(t.reps||0)}});
  const known=new Set(sess.map(x=>x.id));
  const extra=[]; // serie bez rekordu sesji (np. po ręcznym przywróceniu)
  agg.forEach((a,k)=>{ if(!known.has(k)){ const t=sets.find(x=>(x.sid||("d-"+x.date))===k); extra.push({id:k,title:"Wpis ręczny",start:(t.date||"")+"T12:00",ts:t.ts||0,date:t.date,src:t.src||"manual"}) } });
  return {list:sess.concat(extra).sort((a,b)=>(b.ts||0)-(a.ts||0)), agg, sets};
}
function histBody(sid, sets){
  const mine=sets.filter(t=>(t.sid||("d-"+t.date))===sid);
  const by=new Map(); mine.forEach(t=>{const c=by.get(t.ex)||[]; c.push(t); by.set(t.ex,c)});
  return [...by.entries()].map(([ex,list])=>{
    list.sort((a,b)=>(a.i||0)-(b.i||0));
    const txt=list.map(t=>`${t.type==="warmup"?"R ":t.type==="failure"?"U ":t.type==="dropset"?"D ":""}${prevText(t,t.u||"")}${prevRir(t)!==""?` @${prevRir(t)}`:""}`).join(" · ");
    return `<div class="h-ex"><b>${esc(ex)}</b><span class="muted">${esc(txt)}</span></div>`;
  }).join("")||`<p class="muted">Brak serii.</p>`;
}
function renderWyniki(week){
  const {list,agg,sets}=sessionAgg();
  const now=Date.now(), wk=now-7*86400000;
  const last7=list.filter(x=>(x.ts||0)>=wk);

  const names=planExNames().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  const shown=list.slice(0,histShown);

  const hist=list.length?`<div class="hist">${shown.map(x=>{const a=agg.get(x.id)||{work:0,warm:0,vol:0};
    return `<details data-sid="${esc(x.id)}"><summary><span><strong>${esc(fmtDatePl(x.date))}</strong> · ${esc(x.title)} <span class="muted">· ${esc(srcLabel[x.src]||x.src||"")}</span></span><span class="num muted">${a.work} rob.${a.warm?` + ${a.warm} rozgr.`:""}</span></summary><div class="h-body"></div></details>`}).join("")}</div>
    ${list.length>shown.length?`<div class="btn-row"><button type="button" class="btn btn-ghost" id="hist-more">Pokaż starsze (${list.length-shown.length})</button></div>`:""}`
    :`<p class="muted">Brak zapisanych treningów. Zacznij trening z karty dnia albo zaimportuj historię z Hevy w „Dane i kopia”. Dane zostają tylko na tym urządzeniu.</p>`;
  document.getElementById("p-wyniki").innerHTML = `
    <div class="kpis">

      <div class="kpi"><b class="num">${w7}</b><span>serie robocze (7 dni)</span></div>
      <div class="kpi"><b class="num">${list.length}</b><span>treningi razem</span></div>
      <div class="kpi"><b class="num">${sets.length}</b><span>serie razem</span></div>

          <label class="field"><span>Ćwiczenie</span><select name="ex">${names}</select></label>
          <label class="field"><span>Ciężar (kg)</span><input name="kg" type="text" inputmode="decimal" required></label>
          <label class="field"><span>Serie</span><input name="sets" type="number" min="1" max="20" value="3" inputmode="numeric" required></label>
          <label class="field"><span>Powtórzenia</span><input name="reps" type="number" min="1" inputmode="numeric" required></label>
          <label class="field"><span>RIR</span><input name="rir" type="number" min="0" max="10" value="3" inputmode="numeric"></label>
        </div>
        <button class="btn btn-primary" type="submit">Zapisz serie</button>
      </form></details>
    </div>`;
  const form=document.getElementById("l-form");
  form.date.value = todayStr();
  form.onsubmit=e=>{

    const ts=new Date(date+"T12:00:00").getTime()||Date.now();
    if(!sess.some(x=>x.id===sid)) sess.push({id:sid,title:"Wpis ręczny",start:date+"T12:00",ts,date,src:"manual"});
    const exName=String(f.get("ex")); const cnt=Math.min(20,Math.max(1,parseInt(f.get("sets"),10)||1));

    for(let k=0;k<cnt;k++){const t={id:newId("m"),sid,ts,date,ex:exName,i:have+k,type:"normal",kg:num(f.get("kg")),reps:num(f.get("reps")),src:"manual"}; const rir=num(f.get("rir")); if(rir!==null)t.rir=rir; all.push(t)}
    if(saveJSON(LS.sets,all)&&saveJSON(LS.sessions,sess)){toast("Zapisano serie"); renderWyniki(week); renderChrome()}
  };

  }));

}
async function deleteSession(sid){
  const ok=await ask({title:"Usunąć trening?", text:"Usunę wszystkie serie tego treningu z dziennika. Nie da się tego cofnąć (poza wczytaniem kopii).", ok:"Usuń trening", danger:true});

function normTxt(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l")}
function loadExDb(){
  if(EXDB) return Promise.resolve(EXDB);
  if(exLoading) return exLoading;
  exLoading=fetch("data/exercises.json").then(r=>{if(!r.ok) throw new Error("HTTP "+r.status); return r.json()}).then(j=>{
    EXMETA=j.meta;

      e.hay=normTxt([e.p||"",e.n,e.m.map(m=>EXMETA.mu[m]||m).join(" "),EXMETA.eq[String(e.e===null?"null":e.e)]||""].join(" "));

function historyFor(e){

  loadJSON(LS.sets,[]).forEach(t=>{
    const k=normKey(t.ex), base=normKey(String(t.ex).replace(/\s*\([^)]*\)\s*$/,""));

    </div>
    <div class="card"><h2>Twoja historia</h2>${histHtml}</div>
    <div class="card"><h2>Jak wykonać</h2><p class="muted">Instrukcje po angielsku (źródło: Free Exercise DB). Zakres ruchu i ciężar trzymaj zgodnie z planem.</p><ol class="steps">${e.t.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>
    <p class="src-note">Źródło: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">Free Exercise DB</a>, licencja Unlicense (domena publiczna).</p>`;
}
function openExCard(id){
  $("v-excard-t").textContent="Ćwiczenie"; $("v-excard-body").innerHTML=`<p class="muted" role="status">Wczytuję…</p>`;
  openView("v-excard");
  loadExDb().then(()=>{const e=EXMAP.get(id); if(e) renderExCard(e); else $("v-excard-body").innerHTML=`<p class="err" role="alert">Nie znaleziono ćwiczenia w bazie.</p>`})
   .catch(()=>{$("v-excard-body").innerHTML=`<p class="err" role="alert">Nie udało się wczytać bazy ćwiczeń. Sprawdź połączenie.</p>`});
}
function exLinks(name){
  const id=PLAN_DBID[name]; if(!id) return "";
  return `<div class="ex-links"><button type="button" class="btn btn-ghost" data-ex-open="${esc(id)}">Technika i zdjęcia</button><button type="button" class="btn btn-ghost" data-ex-sim="${esc(id)}">Zamienniki w bazie</button></div>`;
}
document.addEventListener("error",e=>{ if(e.target&&e.target.tagName==="IMG"&&e.target.dataset.fb) e.target.style.visibility="hidden" },true);

/* --- kopia zapasowa --- */
function appKeys(){
  const k=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key&&key.startsWith("plan28-")&&!NOBACKUP.includes(key)) k.push(key);
  }
  return k.sort();
}
function snapshotRaw(){const o={};appKeys().forEach(k=>o[k]=localStorage.getItem(k));return o}
function buildBackup(){
  const data={};
  for(const [k,raw] of Object.entries(snapshotRaw())) data[k]=JSON_KEYS.includes(k)?safeParse(raw,raw):raw;
  return {app:"plan28", schema:SCHEMA, version:APP_VERSION, exportedAt:new Date().toISOString(), data};
}
function countOf(data, key){
  const v=data[key]; const a=typeof v==="string"?safeParse(v,[]):v;
  return Array.isArray(a)?a.length:0;
}
function describeData(data){
  return {
    sets:countOf(data,LS.sets), sessions:countOf(data,LS.sessions),
    measures:countOf(data,LS.measures), legacy:countOf(data,LS.logs), imports:countOf(data,LS.imports)
  };
}
function currentData(){const d={};for(const [k,raw] of Object.entries(snapshotRaw())) d[k]=raw;return d}
function hasUserData(){const c=describeData(currentData());return c.sets+c.measures+c.legacy>0}
function backupAgeDays(){
  const t=getSettings().lastBackup; if(!t) return null;
  const ms=Date.now()-new Date(t).getTime(); return Math.max(0,Math.floor(ms/86400000));
}
function backupDue(){
  if(!hasUserData()) return false;
  const a=backupAgeDays(); return a===null || a>7;
}
function validateBackup(obj){
  if(!obj||typeof obj!=="object") return "To nie jest plik kopii Plan 28.";
  if(obj.app!=="plan28") return "To nie jest plik kopii Plan 28 (brak znacznika aplikacji).";
  if(typeof obj.schema!=="number") return "Plik nie ma wersji schematu.";
  if(obj.schema>SCHEMA) return `Kopia pochodzi z nowszej wersji aplikacji (schemat ${obj.schema}). Odśwież stronę i spróbuj ponownie.`;
  if(!obj.data||typeof obj.data!=="object"||Array.isArray(obj.data)) return "Plik nie zawiera danych.";
  for(const [k,v] of Object.entries(obj.data)){
    if(!k.startsWith("plan28-")) return `Nieznany klucz danych: ${k.slice(0,40)}`;
    if([LS.sets,LS.sessions,LS.imports,LS.measures,LS.logs].includes(k) && !Array.isArray(v)) return `Uszkodzone dane: ${k}`;
    if([LS.settings,LS.active,LS.aliases].includes(k) && v!==null && typeof v!=="object") return `Uszkodzone dane: ${k}`;
  }
  return null;
}
function applyData(data){
  appKeys().forEach(k=>localStorage.removeItem(k));
  for(const [k,v] of Object.entries(data)){
    if(!k.startsWith("plan28-")||NOBACKUP.includes(k)) continue;
    localStorage.setItem(k, typeof v==="string"?v:JSON.stringify(v));
  }
}
function downloadBackup(){
  const b=buildBackup();
  const name=`plan28-kopia-${todayStr()}.json`;
  const blob=new Blob([JSON.stringify(b,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},1500);
  saveSettings({lastBackup:b.exportedAt});
  requestPersist();
  toast("Kopia zapisana. Sprawdź plik w Pobranych lub w Plikach.");
  renderChrome(); if($("v-data").classList.contains("on")) renderDane();
}
async function shareBackup(){
  const b=buildBackup();
  const file=new File([JSON.stringify(b,null,1)],`plan28-kopia-${todayStr()}.json`,{type:"application/json"});
  try{
    await navigator.share({files:[file], title:"Kopia Plan 28"});
    saveSettings({lastBackup:b.exportedAt}); renderChrome(); renderDane();
  }catch(e){ if(e&&e.name!=="AbortError") toast("Nie udało się udostępnić pliku. Użyj „Zapisz kopię”."); }
}
function previewImport(obj, fileName){
  const err=validateBackup(obj);
  const box=$("bk-preview");
  if(err){box.innerHTML=`<p class="err" role="alert">${esc(err)}</p>`; return}
  const inc=describeData(obj.data), cur=describeData(currentData());
  const row=(label,a,b)=>`<tr><th scope="row">${label}</th><td class="num">${a}</td><td class="num">${b}</td></tr>`;
  box.innerHTML=`<div class="callout"><strong>Podgląd kopii</strong> ${esc(fileName||"")}<br>
    <span class="muted">Zapisana: ${obj.exportedAt?esc(fmtDateTimePl(obj.exportedAt)):"brak daty"} · schemat ${esc(obj.schema)}</span></div>
    <div class="table-wrap"><table class="kv"><thead><tr><th></th><th class="num">W pliku</th><th class="num">Teraz</th></tr></thead><tbody>
    ${row("Serie",inc.sets,cur.sets)}${row("Sesje",inc.sessions,cur.sessions)}${row("Pomiary",inc.measures,cur.measures)}${row("Wyniki ręczne (stare)",inc.legacy,cur.legacy)}
    </tbody></table></div>
    <p class="muted">Wczytanie zastępuje wszystkie dane na tym urządzeniu danymi z pliku. Poprzedni stan zachowam, więc będzie można to cofnąć.</p>
    <div class="btn-row"><button type="button" class="btn btn-danger" id="bk-apply">Zastąp dane danymi z pliku</button><button type="button" class="btn btn-ghost" id="bk-cancel">Anuluj</button></div>`;
  $("bk-cancel").onclick=()=>{box.innerHTML=""};
  $("bk-apply").onclick=async()=>{
    const ok=await ask({title:"Zastąpić dane?", text:`Dane na tym urządzeniu zostaną zastąpione kopią (${nPl(inc.sets,"seria","serie","serii")}, ${nPl(inc.sessions,"sesja","sesje","sesji")}). Można to cofnąć.`, ok:"Zastąp dane", danger:true});
    if(!ok) return;
    const before=snapshotRaw();
    try{ localStorage.setItem(LS.undo, JSON.stringify({ts:Date.now(), data:before})); }
    catch(e){ box.innerHTML=`<p class="err" role="alert">Brak miejsca na punkt cofania. Najpierw zapisz kopię obecnych danych albo usuń część wyników.</p>`; return }
    try{
      applyData(obj.data);
      const st=getSettings(); if(obj.exportedAt) saveSettings({lastBackup:obj.exportedAt});
    }catch(e){
      applyData(before); localStorage.removeItem(LS.undo);
      box.innerHTML=`<p class="err" role="alert">Nie udało się wczytać kopii (brak miejsca?). Dane zostały przywrócone.</p>`; return;
    }
    toast("Kopia wczytana"); renderAll(); renderChrome(); renderDane();
  };
}
async function undoRestore(){
  const u=safeParse(localStorage.getItem(LS.undo),null);
  if(!u||!u.data) return;
  const ok=await ask({title:"Cofnąć wczytanie kopii?", text:`Przywrócę stan sprzed wczytania (${fmtDateTimePl(u.ts)}). Dane z wczytanej kopii zostaną usunięte z tego urządzenia.`, ok:"Cofnij", danger:true});
  if(!ok) return;
  applyData(u.data); localStorage.removeItem(LS.undo);
  toast("Przywrócono poprzednie dane"); renderAll(); renderChrome(); renderDane();
}
async function storageInfo(){
  const o={persisted:null,usage:null,quota:null};
  try{
    if(navigator.storage){
      if(navigator.storage.persisted) o.persisted=await navigator.storage.persisted();
      if(navigator.storage.estimate){const e=await navigator.storage.estimate();o.usage=e.usage;o.quota=e.quota}
    }
  }catch(e){}
  return o;
}
async function requestPersist(){
  try{ if(navigator.storage&&navigator.storage.persist) return await navigator.storage.persist(); }catch(e){}
  return null;
}
function lsBytes(){let n=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("plan28-")) n+=(k.length+(localStorage.getItem(k)||"").length)*2}return n}
function fmtBytes(n){if(n>=1073741824)return (n/1073741824).toFixed(1).replace(".",",")+" GB";return n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB"}
function isStandalone(){return window.navigator.standalone===true || (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}

function renderDane(){
  const body=$("v-data-body"); if(!body) return;
  const cnt=describeData(currentData());
  const age=backupAgeDays();
  const st=getSettings();
  const stat = age===null
    ? `<p class="status-warn" id="bk-status"><strong>Jeszcze nie robiono kopii.</strong></p>`
    : `<p class="${age>7?"status-warn":"status-ok"}" id="bk-status"><strong>Ostatnia kopia: ${age===0?"dziś":nPl(age,"dzień","dni","dni")+" temu"}</strong> <span class="muted">(${esc(fmtDateTimePl(st.lastBackup))})</span></p>`;
  const undo=safeParse(localStorage.getItem(LS.undo),null);
  const canShare=!!(navigator.canShare&&navigator.share&&(()=>{try{return navigator.canShare({files:[new File(["x"],"x.json",{type:"application/json"})]})}catch(e){return false}})());
  body.innerHTML=`
    <div class="card">
      <h2>Kopia zapasowa</h2>
      ${stat}
      <p class="muted">Na tym urządzeniu: ${nPl(cnt.sets,"seria","serie","serii")}, ${nPl(cnt.sessions,"sesja","sesje","sesji")}, ${nPl(cnt.measures,"pomiar","pomiary","pomiarów")}${cnt.legacy?`, ${nPl(cnt.legacy,"stary wynik","stare wyniki","starych wyników")}`:""}. Zajęte miejsce: ${esc(fmtBytes(lsBytes()))} z ok. 5 MB dostępnych dla strony.</p>
      <p class="muted">Dane są tylko w tej przeglądarce. Plik kopii zawiera je w całości; trzymaj go w Plikach, na dysku albo wyślij sobie.</p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="bk-export">Zapisz kopię (plik JSON)</button>
        ${canShare?`<button type="button" class="btn btn-ghost" id="bk-share">Udostępnij kopię…</button>`:""}
        <button type="button" class="btn btn-ghost" id="bk-pick">Wczytaj kopię z pliku</button>
      </div>
      <input type="file" id="bk-file" class="sr-only" accept=".json,application/json" tabindex="-1" aria-label="Plik kopii zapasowej (JSON)">
      <div id="bk-preview" aria-live="polite"></div>
      ${undo&&undo.data?`<div class="callout">Wczytano kopię ${esc(fmtDateTimePl(undo.ts))}. <button type="button" class="btn btn-ghost btn-inline" id="bk-undo">Cofnij wczytanie kopii</button></div>`:""}
    </div>
    ${hevyCard()}
    ${settingsCard()}
    <div class="card">
      <h2>Trwałość danych</h2>
      <p id="persist-status" class="muted">Sprawdzam…</p>
      <p class="muted" id="storage-usage"></p>
      <div class="btn-row"><button type="button" class="btn btn-ghost" id="persist-btn">Poproś o trwałe przechowywanie</button></div>
      <h3 style="margin-top:20px">Dodaj do ekranu głównego (iPhone)</h3>
      <p class="${isStandalone()?"status-ok":"muted"}">${isStandalone()?"Ta strona działa już jako aplikacja z ekranu głównego.":(isIOS()?"Robisz to w Safari na tym telefonie.":"Na iPhonie otwórz tę stronę w Safari.")}</p>
      <ol class="steps">
        <li>Stuknij Udostępnij (kwadrat ze strzałką) w Safari.</li>
        <li>Wybierz „Dodaj do ekranu początkowego”, potem „Dodaj”.</li>
        <li>Od teraz otwieraj Plan 28 z ikony na ekranie.</li>
      </ol>
      <p class="muted">Safari może usunąć dane stron, z którymi nie było kontaktu przez 7 dni używania przeglądarki. Aplikacje dodane do ekranu głównego są z tego wyłączone. Aplikacja z ikony może mieć osobny magazyn danych: zrób kopię w Safari przed instalacją i wczytaj ją po pierwszym uruchomieniu z ikony.</p>
    </div>
    <div class="card">
      <h2>O aplikacji</h2>
      <p class="muted">Wersja ${esc(APP_VERSION)} · schemat danych ${SCHEMA}. Wszystkie Twoje dane zostają w pamięci tego urządzenia i nie są nigdzie wysyłane.</p>
      <p class="muted">Baza ćwiczeń: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener" style="color:var(--accent-text)">Free Exercise DB</a> (yuhonas), licencja Unlicense (domena publiczna). Zdjęcia ćwiczeń z planu są zapisane na stronie w zmniejszonej wersji, pozostałe ładują się z cdn.jsdelivr.net dopiero po otwarciu bazy.</p>
    </div>`;
  $("bk-export").onclick=downloadBackup;
  const sh=$("bk-share"); if(sh) sh.onclick=shareBackup;
  $("bk-pick").onclick=()=>$("bk-file").click();
  $("bk-file").onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    if(f.size>8*1048576){$("bk-preview").innerHTML=`<p class="err" role="alert">Plik jest za duży (limit 8 MB).</p>`;return}
    let obj=null;
    try{obj=JSON.parse(await f.text())}catch(err){$("bk-preview").innerHTML=`<p class="err" role="alert">Nie mogę odczytać pliku: to nie jest poprawny JSON.</p>`;return}
    previewImport(obj,f.name);
  };
  const u=$("bk-undo"); if(u) u.onclick=undoRestore;
  wireHevy(); wireSettings(); if(hv) renderHevyPreview();
  $("persist-btn").onclick=async()=>{const r=await requestPersist(); toast(r===true?"Przeglądarka zapamięta dane trwale":r===false?"Przeglądarka nie przyznała trwałego przechowywania":"Ta przeglądarka nie obsługuje tej funkcji"); refreshStorage()};
  refreshStorage();
}
async function refreshStorage(){
  const i=await storageInfo();
  const ps=$("persist-status"), us=$("storage-usage"); if(!ps) return;
  ps.textContent = i.persisted===true ? "Trwałe przechowywanie: włączone." : i.persisted===false ? "Trwałe przechowywanie: nie przyznane. Przeglądarka może usunąć dane przy braku miejsca; zrób kopię." : "Ta przeglądarka nie podaje stanu trwałego przechowywania. Polegaj na kopii zapasowej.";
  if(i.usage!=null&&i.quota!=null) us.textContent=`Użycie pamięci przez stronę: ${fmtBytes(i.usage)} z ${fmtBytes(i.quota)}.`;
}
/* kropka i baner przypomnienia */
function renderChrome(){
  const due=backupDue(), d=$("data-dot");
  if(d) d.hidden=!due;
  const b=$("data-btn"); if(b) b.setAttribute("aria-label", due?"Dane i kopia zapasowa — kopia jest nieaktualna":"Dane i kopia zapasowa");
}
function backupBanner(){
  if(!backupDue()) return "";
  const a=backupAgeDays();
  return `<div class="banner" role="note"><p><strong>${a===null?"Nie masz jeszcze kopii zapasowej.":`Ostatnia kopia sprzed ${nPl(a,"dnia","dni","dni")}.`}</strong> Zapisz plik, żeby nie stracić serii i pomiarów.</p><button type="button" class="btn btn-primary" data-open-data>Zrób kopię</button></div>`;
}

function renderAll(){
  migrateLegacy();
  const w=currentWeekSel();
  const b=blockOf(w);
  document.getElementById("top-sub").textContent = `Tydzień ${w} · blok ${b.id} ${b.name}`;
  renderWeek(w); renderPlan(w); renderDieta(w); renderPomiary(); renderWyniki(w); renderChrome();
}

function openApp(){
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.add("on");
  renderAll();
}

document.getElementById("lock-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const val=(document.getElementById("pw").value||"").trim();
  const hash=await sha256(val);
  if(PASS_HASHES.includes(hash)){
    sessionStorage.setItem(LS.gate,"1");
    document.getElementById("pw-err").textContent="";
    openApp();
  } else {
    document.getElementById("pw-err").textContent="Nieprawidłowe hasło.";
  }
});

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.removeAttribute("aria-current"));
    btn.setAttribute("aria-current","page");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
    document.getElementById(btn.dataset.tab).classList.add("on");
    window.scrollTo({top:0});
  });
});

document.getElementById("theme-btn").onclick=()=>{
  const cur=document.documentElement.dataset.theme;
  const next=cur==="dark"?"light":cur==="light"?"":"dark";
  if(next) document.documentElement.dataset.theme=next; else document.documentElement.removeAttribute("data-theme");
  if(next) localStorage.setItem(LS.theme,next); else localStorage.removeItem(LS.theme);
};


document.addEventListener("click",e=>{
  const eo=e.target.closest("[data-ex-open]"); if(eo){openExCard(eo.dataset.exOpen); return}
  const es=e.target.closest("[data-ex-sim]"); if(es){
    const id=es.dataset.exSim; loadExDb().then(()=>{const x=EXMAP.get(id); if(document.getElementById("v-excard").classList.contains("on")) closeView("v-excard"); openExView({mu:x&&x.m[0]||""})}).catch(()=>toast("Nie udało się wczytać bazy ćwiczeń")); return}
  if(e.target.closest("[data-open-ex]")){openExView(); return}
  const sd=e.target.closest("[data-start-day]");
  if(sd){startSession(sd.dataset.startDay); return}
  if(e.target.closest("[data-resume]")){ if(getActive()){sesPrev=buildPrev(getActive().id); openSessionView()} return}
  const ds=e.target.closest("[data-del-sess]"); if(ds){deleteSession(ds.dataset.delSess); return}
  const t=e.target.closest("[data-open-data]");
  if(t){renderDane(); openView("v-data"); return}
  const c=e.target.closest("[data-close]");
  if(c){const v=c.closest(".view"); if(v) closeView(v.id)}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("modal").classList.contains("on")){const v=document.querySelector(".view.on"); if(v) closeView(v.id)}
});

$("rest-m").onclick=()=>adjustRest(-15); $("rest-p").onclick=()=>adjustRest(15); $("rest-skip").onclick=()=>stopRest();
bindSession();
const topEl=document.getElementById("top");
window.addEventListener("scroll",()=>topEl.classList.toggle("stuck", scrollY>8), {passive:true});

if(sessionStorage.getItem(LS.gate)==="1") openApp();
</script>
