:root{

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

}

}

html{-webkit-text-size-adjust:100% }

.ex-name{font-weight:600}
.ex-load{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:600;white-space:nowrap}

label.field{display:block;margin:0 0 12px}
label.field span{display:block;margin:0 0 6px;font-size:var(--fs-footnote);color:var(--text-2)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-footnote);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sep);vertical-align:top}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sticky);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--sep)}

.panel{display:none}
.panel.on{display:block}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--sep);border-radius:var(--r-pill);padding:10px 16px;z-index:var(--z-toast);display:none}
#toast.on{display:block}
.err{color:var(--bad-text);font-size:var(--fs-footnote);min-height:1.2em;margin:8px 0 0}

  {id:"D", kcal:[2500,2700], p:[170,180], f:[70,85], c:[240,300], note:"Doprecyzowanie wyglądu: wolny deficyt albo utrzymanie, jeśli proporcje już wyglądają tak, jak chcesz."}
];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function blockOf(w){return BLOCKS.find(b=>w>=b.weeks[0]&&w<=b.weeks[1])}
function isDeload(w){return w===6 || w===28}
function rirOf(w){
  if(w<=2) return "RIR 4";
  if(w<=4) return "RIR 3";
  if(w===5) return "RIR 2–3";
  if(w===6) return "RIR 3 · deload: mniej serii i trochę lżejszy ciężar";
  if(w<=21) return "RIR 2";
  if(w===28) return "RIR 3 · deload końcowy";
  return "RIR 2 · jakość powtórzenia, bez dokładania serii";
}
function roundTo(v, step){
  if(!step) return 0;
  return Math.round(v/step)*step;
}
function loadPct(week){
  if(week<=2) return 0;
  if(week===6) return 0.10;
  if(week<=5) return 0.08*(week-2);
  if(week<=14) return 0.25 + (week-7)*(0.35/7);
  if(week<=21) return 0.62 + (week-15)*(0.28/6);
  if(week<=27) return 0.90 + (week-22)*0.016;
  return 0.65;
}
function loadFor(ex, week){
  if(ex.bw) return "bw";
  if(!ex.step && (ex.w==null)) return null;
  if(!ex.step) return ex.w||null;
  const span = (ex.cap??ex.w) - ex.w;
  const raw = ex.w + span * loadPct(week);
  return Math.min(ex.cap??raw, roundTo(raw, ex.step));
}
function fmtKg(v){
  if(v==="bw") return "ciężar ciała";
  if(v==null) return "dobór wg RIR";
  return (Number.isInteger(v)?v:v.toFixed(1).replace(".",","))+" kg";
}
function repsFor(ex, week){
  if(ex.r) return ex.r;
  const b = blockOf(week).id;
  if(ex.kind==="iso") return {A:"12–15",B:"10–12",C:"10–12",D:"12–15"}[b];
  return {A:"8–10",B:"6–10",C:"6–8",D:"8–10"}[b];
}
function setsFor(ex, week, idx, dayId){
  if(isDeload(week)) return 2;
  const b = blockOf(week).id;
  const isLower = dayId==="LA"||dayId==="LB";
  const main = ex.kind==="main" || idx<2;
  if(b==="A") return week<=2 ? 2 : (main?3:2);
  if(b==="B") return main?4:3;
  if(b==="C"){
    if(isLower) return main?3:2;
    return main?4:3;
  }
  return 3;
}
function setsForCore(week){
  if(isDeload(week)) return 2;
  const b = blockOf(week).id;
  if(b==="A") return 2;
  if(b==="D") return 2;
  return 3;
}

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function renderWorkouts(week){
  return DAYS.map(day=>{
    const lifts = EX[day.id].map((ex,i)=>{
      const kg = loadFor(ex, week);

      return `<div class="ex">
        <div class="ex-top"><div class="ex-name">${esc(ex.n)}</div><div class="ex-load">${esc(fmtKg(kg))}</div></div>

      </div>`;
    }).join("");
    const core = CORE[day.id].map(ex=>{
      const kg = loadFor(ex, week);
      const sets = setsForCore(week);
      return `<div class="ex">
        <div class="ex-top"><div class="ex-name">${esc(ex.n)}</div><div class="ex-load">${esc(fmtKg(kg))}</div></div>
        <div class="chips"><span class="chip">${sets} × ${esc(ex.r)}</span><span class="chip">brzuch i postawa</span></div>
        <div class="alt">Zamiennik: ${esc(ex.alt)}</div>
      </div>`;
    }).join("");
    const list = sessionOpen(day.id)
      + `<div class="ex"><div class="ex-top"><div class="ex-name">4. Trening właściwy</div></div></div>` + lifts
      + `<div class="ex"><div class="ex-top"><div class="ex-name">5. Brzuch i postawa</div></div>

    return `<article class="card"><h3>${esc(day.label)} · ${esc(day.name)}</h3>${list}${sessionClose(day.id)}</article>`;
  }).join("");
}

}

      <form id="l-form">
        <div class="grid2">
          <label class="field"><span>Data</span><input name="date" type="date" required></label>
          <label class="field"><span>Ćwiczenie</span><select name="ex">${opts}</select></label>
          <label class="field"><span>Ciężar (kg)</span><input name="kg" type="number" step="0.5" inputmode="decimal" required></label>
          <label class="field"><span>Serie</span><input name="sets" type="number" min="1" value="3" required></label>
          <label class="field"><span>Powtórzenia</span><input name="reps" type="number" min="1" required></label>
          <label class="field"><span>RIR</span><input name="rir" type="number" min="0" max="5" value="3" required></label>
        </div>
        <button class="btn btn-primary" type="submit">Zapisz wynik</button>
      </form>
    </div>
    <div class="card"><h2>Dziennik</h2>${table}</div>`;
  const form=document.getElementById("l-form");
  form.date.value = new Date().toISOString().slice(0,10);
  form.onsubmit=e=>{
    e.preventDefault();
    const rec=Object.fromEntries(new FormData(form).entries());
    const next=[rec, ...loadJSON(LS.logs,[])];
    localStorage.setItem(LS.logs, JSON.stringify(next));
    toast("Zapisano wynik");
    renderWyniki(week);
  };
  document.querySelectorAll("[data-dlog]").forEach(btn=>{
    btn.onclick=()=>{
      const next=loadJSON(LS.logs,[]);
      next.splice(Number(btn.dataset.dlog),1);
      localStorage.setItem(LS.logs, JSON.stringify(next));
      renderWyniki(week);
    };
  });
}

function renderAll(){
  const w=currentWeekSel();
  const b=blockOf(w);
  document.getElementById("top-sub").textContent = `Tydzień ${w} · blok ${b.id} ${b.name}`;
  renderWeek(w); renderPlan(w); renderDieta(w); renderPomiary(); renderWyniki(w);
}

function openApp(){
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.add("on");
  renderAll();
}

document.getElementById("lock-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const val=document.getElementById("pw").value||"";
  const hash=await sha256(val);
  if(hash===PASS_HASH){
    sessionStorage.setItem(LS.gate,"1");
    document.getElementById("pw-err").textContent="";
    openApp();
  } else {
    document.getElementById("pw-err").textContent="Nieprawidłowe hasło.";
  }
});

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.removeAttribute("aria-current"));
    btn.setAttribute("aria-current","page");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
    document.getElementById(btn.dataset.tab).classList.add("on");
    window.scrollTo({top:0});
  });
});

document.getElementById("theme-btn").onclick=()=>{
  const cur=document.documentElement.dataset.theme;
  const next=cur==="dark"?"light":cur==="light"?"":"dark";
  if(next) document.documentElement.dataset.theme=next; else document.documentElement.removeAttribute("data-theme");
  if(next) localStorage.setItem(LS.theme,next); else localStorage.removeItem(LS.theme);
};

const topEl=document.getElementById("top");
window.addEventListener("scroll",()=>topEl.classList.toggle("stuck", scrollY>8), {passive:true});

if(sessionStorage.getItem(LS.gate)==="1") openApp();
</script>
</body>
</html>
